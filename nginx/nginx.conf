# Core NGINX Configuration for store_gateway
# Explain 'Why': Worker count set to auto to scale dynamically across container CPU allocation.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    # Explain 'Why': 1024 worker connections provides sufficient headroom for concurrent proxy subrequests without starving system file descriptors.
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Explain 'Why': Custom log format capturing $request_id enables end-to-end distributed request tracing across gateway and downstream microservices.
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    log_format combined_tracing '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'request_id=$request_id req_time=$request_time '
                                'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log combined_tracing;

    # Explain 'Why': sendfile and tcp_nopush optimize network packet throughput for large payloads and static assets.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Explain 'Why': Gzip compression reduces payload size for JSON responses and OpenAPI documentation specs.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/yaml text/yaml;

    # Explain 'Why': Map directive provides a fallback request ID if none is supplied by the incoming client, ensuring trace continuity.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Explain 'Why': Dynamic CORS origin validation mapping.
    # Allows credentials safely by echoing matching origin instead of wildcard '*'.
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
    }

    # Include virtual host definitions generated from templates
    include /etc/nginx/conf.d/*.conf;
}
