# Standard Reverse Proxy Parameters Snippet
# Explain 'Why': HTTP/1.1 and clearing Connection header enables connection reuse (keepalive) to downstream microservices, reducing TCP handshake latency.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Explain 'Why': Preserves original client routing, IP address, and protocol information for audit logging and downstream rate limiting.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Explain 'Why': Propagates the unified trace ID to allow end-to-end request tracking in downstream application logs.
proxy_set_header X-Request-ID $req_id;

# Explain 'Why': Explicitly passes authentication headers and cookie credentials to downstream microservices.
proxy_set_header Authorization $http_authorization;
proxy_pass_header Set-Cookie;
proxy_pass_header Cookie;

# Proxy buffer and timeout configurations
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 8k;
