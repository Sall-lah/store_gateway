# Gateway Authentication Offloading (Mutation Only) Snippet
# Explain 'Why': Used by services with public read access (e.g. product catalog) where GET passes anonymously, but mutating methods require verified caller claims.

# 1. Enforce authentication subrequest for mutating methods
auth_request /_auth_verify_mutation_only;

# 2. Extract verified claims from auth service response headers
auth_request_set $auth_user_id $upstream_http_x_user_id;
auth_request_set $auth_user_role $upstream_http_x_user_role;
auth_request_set $auth_user_email $upstream_http_x_user_email;

# 3. Inject verified identity headers into downstream proxy request
proxy_set_header X-User-Id $auth_user_id;
proxy_set_header X-User-Role $auth_user_role;
proxy_set_header X-User-Email $auth_user_email;
