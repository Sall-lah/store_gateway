# Security and Defense-in-Depth Headers Snippet
# Explain 'Why': Sets baseline HTTP response security headers across all proxied endpoints to mitigate common browser exploits.

# Explain 'Why': Prevents browsers from MIME-sniffing a response away from the declared content-type.
add_header X-Content-Type-Options "nosniff" always;

# Explain 'Why': Restricts embedding inside iframes to prevent clickjacking attacks.
add_header X-Frame-Options "SAMEORIGIN" always;

# Explain 'Why': Enables legacy browser XSS filters and blocks page rendering on detected attacks.
add_header X-XSS-Protection "1; mode=block" always;

# Explain 'Why': Limits referrer information sent to external domains while retaining full path for same-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Explain 'Why': Disables sensitive browser hardware APIs by default.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Explain 'Why': Reflects the distributed request ID back to client for frontend error correlation and customer support ticketing.
add_header X-Request-ID $req_id always;
