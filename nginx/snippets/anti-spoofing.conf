# Anti-Spoofing Header Sanitization Snippet
# Explain 'Why': External clients must NEVER be allowed to inject internal identity or role assertions into downstream microservices.
# Downstream services must extract and verify identity solely from the cryptographically signed RS256 JWT Authorization token.

proxy_set_header X-User-Id "";
proxy_set_header X-User-Email "";
proxy_set_header X-User-Role "";
proxy_set_header X-User-Permissions "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Consumer-Custom-Id "";
