# Anti-Spoofing Header Sanitization Snippet
# Explain 'Why': External clients must NEVER be allowed to inject arbitrary internal identity or role assertions into downstream microservices.
# All unverified incoming identity headers are cleared by default, and only populated by gateway authentication offloading when verified.

proxy_set_header X-User-Id "";
proxy_set_header X-User-Email "";
proxy_set_header X-User-Role "";
proxy_set_header X-User-Permissions "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Consumer-Custom-Id "";
